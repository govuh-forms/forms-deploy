name: GOV.UH Forms government identity regression

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-deployed-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out controlled release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify centrally approved UH government arms on live Forms applications
        run: |
          node --version
          node uh-source/assurance/verify-live-uh-identity.mjs
